[package]
name = "subagent_broker"
version = "3.1.0"
edition = "2021"
rust-version = "1.75"
description = "Local short-lived deterministic process broker for isolated subagent harness runs"
license = "MIT"
publish = false

[features]
default = []
dev-harness = []

[[bin]]
name = "subagent-broker"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = [
    "process",
    "io-util",
    "signal",
    "sync",
    "time",
    "fs",
    "macros",
    "rt-multi-thread",
    "io-std",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "=4.5.4", features = ["derive"] }
thiserror = "2"
tempfile = "=3.10.1"
globset = "=0.4.14"
sha2 = "0.10"
hex = "0.4"
nix = { version = "0.29", features = ["signal", "process"] }
fs2 = "0.4"

[dev-dependencies]
proptest = "=1.4.0"
assert_cmd = "=2.0.14"
predicates = "=3.1.0"
tempfile = "=3.10.1"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "allow"
print_stderr = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
