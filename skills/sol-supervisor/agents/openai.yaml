interface:
  display_name: "Sol Supervisor"
  short_description: "Route first; Sol decides, Terra synthesizes, Luna executes/OCRs"
  default_prompt: "Use $sol-supervisor and follow its mandatory workflow loop: ROUTE -> DELEGATE -> WAIT -> SOL DECIDE -> EXECUTE -> VERIFY/REVIEW -> SOL ACCEPT. Do not skip routing or silently take delegated work back into Sol. Preserve Sol context by proactively using Luna xhigh/max for narrow work, validation, and visual OCR/transcription; use Terra high/xhigh for broad bounded synthesis/debugging/review; avoid Terra max."

policy:
  allow_implicit_invocation: true
